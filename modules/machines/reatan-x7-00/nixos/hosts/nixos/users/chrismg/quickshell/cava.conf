# Settings for cava, the audio visualizer behind the Quickshell bar. ../quickshell.nix
# fills in the bar count and passes the path of the result to cava through Theme.qml.

[general]
# The number of bars comes from `spectrumBars` in ../quickshell.nix, which also
# sets it in Theme.qml. AudioSpectrum.qml ignores frames with a different count.
bars = @bars@
framerate = 30

[input]
method = pipewire
source = auto

[output]
# One line of numbers per frame, from 0 to 1000, separated by semicolons
# (character 59), for AudioSpectrum.qml to read.
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 65
